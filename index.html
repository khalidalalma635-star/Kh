
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:100px;
}

input{
    padding:10px;
    width:220px;
    border-radius:10px;
    border:none;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#00aa55;
    color:white;
    font-size:16px;
}

#messages{
    margin-top:20px;
}
</style>
</head>

<body>

<h1>مرحبا بك في موقعي</h1>

<input id="msg" placeholder="اكتب رسالة">
<button onclick="send()">إرسال</button>

<div id="messages"></div>

<script>
function send(){
    let text = document.getElementById("msg").value;

    document.getElementById("messages").innerHTML +=
    "<p>"+ text +"</p>";
}
</script>

</body>
</html>
